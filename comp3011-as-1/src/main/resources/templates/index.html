<!DOCTYPE HTML>
<html>
<head> 
    <title>COMP3011 A1</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css" />
</head>
<body>
	<div class="header">
		<h1>Speech to Text Service</h1>            
	</div>
	
	<div class="container">
		
		<!-------------- Recording Section -------------->
		<div class="container">
			<div id="recIndicator" class="rec-indicator" aria-hidden="true"></div>
		    <p id="status" aria-live="polite">Not recording</p>
		    <button id="startBtn" onclick="startRecording()">Start Recording</button>
		    <button id="stopBtn" onclick="stopRecording()" disabled>Stop Recording</button>
		</div>
		
		<!-------------- Result Section -------------->
		<div class="container">
			<h3>Result Here</h3>
			<p id="transcription" aria-live="polite"></p>
		</div>
	</div>
	
	<script th:src="@{/script.js}"></script>
</body>
</html>
